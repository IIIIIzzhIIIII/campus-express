<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<!-- 用户端公共 head -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - 校园快递驿站用户端'">校园快递驿站用户端</title>
    <link rel="stylesheet" th:href="@{/lib/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/lib/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/common.css(v='20260915')}">
</head>

<!-- 用户端公共脚本 -->
<th:block th:fragment="scripts">
    <script th:src="@{/lib/jquery/jquery.min.js}"></script>
    <script th:src="@{/lib/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js(v='20260915')}"></script>
</th:block>

<!-- 用户端顶部导航 -->
<nav class="navbar navbar-expand bg-white border-bottom sticky-top" th:fragment="navbar(active)">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/student">
            <i class="bi bi-boxes"></i> 校园快递驿站
        </a>
        <div class="d-flex align-items-center gap-2">
            <th:block th:if="${session.loginStudent == null}">
                <a class="btn btn-sm btn-outline-primary" href="/student/login">登录</a>
                <a class="btn btn-sm btn-primary" href="/student/register">注册</a>
            </th:block>
            <th:block th:if="${session.loginStudent != null}">
                <span class="text-muted small">
                    <i class="bi bi-person-circle"></i>
                    <span th:text="${session.loginStudent.realName}">同学</span>
                </span>
                <a class="btn btn-sm btn-primary" href="/student/center">
                    <i class="bi bi-person-workspace"></i> 个人中心
                </a>
                <button class="btn btn-sm btn-outline-secondary" onclick="studentLogout()">退出</button>
            </th:block>
        </div>
    </div>
</nav>

<!-- 用户端退出登录脚本 -->
<th:block th:fragment="logoutScript">
    <script>
        function studentLogout() {
            api.post('/api/student/logout').always(function () {
                location.href = '/student';
            });
        }
    </script>
</th:block>

</html>
