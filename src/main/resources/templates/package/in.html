<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('快件入库')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('in')}"></aside>
    <div class="main">
        <nav th:replace="~{fragments/layout :: topbar}"></nav>
        <main class="content">
            <h5 class="mb-3">快件入库登记</h5>
            <div class="row">
                <div class="col-lg-7">
                    <div class="card">
                        <div class="card-header"><i class="bi bi-inboxes me-1"></i>登记信息</div>
                        <div class="card-body">
                            <form id="inForm">
                                <div class="mb-3">
                                    <label class="form-label">快递单号 <span class="text-danger">*</span></label>
                                    <input class="form-control" name="trackingNo" placeholder="扫描或输入快递单号，回车提交" autofocus>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">快递公司 <span class="text-danger">*</span></label>
                                        <select class="form-select" name="companyId">
                                            <option value="">请选择</option>
                                            <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.companyName}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">货架号</label>
                                        <select class="form-select" name="shelfNo">
                                            <option value="">自动分配</option>
                                            <option th:each="s : ${shelves}" th:value="${s.shelfNo}" th:text="${s.shelfNo}"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">收件人姓名 <span class="text-danger">*</span></label>
                                        <input class="form-control" name="receiverName" placeholder="请输入收件人姓名">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">收件人手机号 <span class="text-danger">*</span></label>
                                        <input class="form-control" name="receiverPhone" placeholder="请输入手机号">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">备注</label>
                                    <input class="form-control" name="remark" placeholder="选填">
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg"></i> 入库</button>
                                    <button type="button" class="btn btn-outline-secondary" onclick="$('#inForm')[0].reset()">重置</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card" id="resultCard" style="display:none">
                        <div class="card-header text-success"><i class="bi bi-check-circle"></i> 入库成功</div>
                        <div class="card-body text-center">
                            <div class="text-muted small">取件码</div>
                            <div class="display-5 fw-bold text-primary" id="pickupCode">------</div>
                            <div class="text-muted small mt-2">货架号：<span id="resultShelf">-</span></div>
                            <hr>
                            <div class="small text-start">
                                <div>单号：<span id="resultTracking"></span></div>
                                <div>收件人：<span id="resultReceiver"></span></div>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">操作提示</div>
                        <div class="card-body small text-muted">
                            <ul class="mb-0">
                                <li>支持扫码枪连续扫码录入，扫码后回车自动提交。</li>
                                <li>未选择货架时，系统将自动分配第一个空闲货架。</li>
                                <li>入库后系统自动生成 6 位取件码。</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    $('#inForm').on('submit', function (e) {
        e.preventDefault();
        var data = {
            trackingNo: $('[name=trackingNo]').val().trim(),
            companyId: $('[name=companyId]').val(),
            receiverName: $('[name=receiverName]').val().trim(),
            receiverPhone: $('[name=receiverPhone]').val().trim(),
            shelfNo: $('[name=shelfNo]').val(),
            remark: $('[name=remark]').val().trim()
        };
        api.post('/api/package/in', data).then(function (d) {
            $('#resultCard').show();
            $('#pickupCode').text(d.pickupCode);
            $('#resultShelf').text(d.shelfNo);
            $('#resultTracking').text(d.trackingNo);
            $('#resultReceiver').text(d.receiverName + ' ' + d.receiverPhone);
            toast('入库成功');
            $('#inForm')[0].reset();
            $('[name=trackingNo]').focus();
        });
    });
</script>
</body>
</html>
