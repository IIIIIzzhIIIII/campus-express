<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('用户管理')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('user')}"></aside>
    <div class="main">
        <nav th:replace="~{fragments/layout :: topbar}"></nav>
        <main class="content">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">用户管理</h5>
                <button class="btn btn-primary" id="btnAdd"><i class="bi bi-plus-lg"></i> 新增用户</button>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4"><input class="form-control form-control-sm" id="qKeyword" placeholder="账号/姓名/手机号"></div>
                        <div class="col-md-2"><button class="btn btn-primary btn-sm w-100" onclick="load(1)">查询</button></div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead><tr><th>账号</th><th>姓名</th><th>手机号</th><th>角色</th><th>状态</th><th>创建时间</th><th style="width:210px">操作</th></tr></thead>
                            <tbody id="tbody"></tbody>
                        </table>
                    </div>
                    <div class="pagination-wrap"><div class="text-muted small" id="pageInfo"></div><div id="pager"></div></div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增用户</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="eId">
            <div class="mb-3"><label class="form-label">账号</label><input class="form-control" id="eUsername"></div>
            <div class="mb-3" id="pwdWrap"><label class="form-label">密码</label><input class="form-control" id="ePassword" placeholder="留空则默认 123456"></div>
            <div class="mb-3"><label class="form-label">姓名</label><input class="form-control" id="eRealName"></div>
            <div class="mb-3"><label class="form-label">手机号</label><input class="form-control" id="ePhone"></div>
            <div class="mb-3"><label class="form-label">角色</label>
                <select class="form-select" id="eRole"><option value="STAFF">驿站员工</option><option value="SUPER_ADMIN">超级管理员</option></select>
            </div>
            <div class="mb-3"><label class="form-label">状态</label>
                <select class="form-select" id="eStatus"><option value="1">启用</option><option value="0">禁用</option></select>
            </div>
            <div class="mb-3"><label class="form-label">备注</label><input class="form-control" id="eRemark"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" onclick="save()">保存</button></div>
    </div></div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    var page = 1, size = 10;
    var ROLE_DESC = {SUPER_ADMIN: '超级管理员', STAFF: '驿站员工'};

    function load(p) {
        page = p || 1;
        api.get('/api/user/page', {page: page, size: size, keyword: $('#qKeyword').val().trim()}).then(function (d) {
            var html = '';
            d.records.forEach(function (r) {
                var ops = '<button class="btn btn-sm btn-outline-primary me-1" onclick="edit(' + r.id + ')">编辑</button>'
                    + '<button class="btn btn-sm btn-outline-warning me-1" onclick="resetPwd(' + r.id + ')">重置密码</button>'
                    + '<button class="btn btn-sm btn-outline-danger" onclick="del(' + r.id + ')">删除</button>';
                html += '<tr><td>' + esc(r.username) + '</td><td>' + esc(r.realName) + '</td><td>' + esc(r.phone) + '</td>'
                    + '<td>' + (r.roleCode === 'SUPER_ADMIN' ? '<span class="badge-soft text-bg-primary">超级管理员</span>' : '<span class="badge-soft text-bg-secondary">驿站员工</span>') + '</td>'
                    + '<td>' + (r.status === 1 ? '<span class="badge-soft text-bg-success">启用</span>' : '<span class="badge-soft text-bg-danger">禁用</span>') + '</td>'
                    + '<td class="small">' + esc(r.createTime) + '</td><td>' + ops + '</td></tr>';
            });
            $('#tbody').html(html || '<tr><td colspan="7" class="text-center text-muted py-4">暂无数据</td></tr>');
            renderPager($('#pager'), page, size, d.total, load);
            $('#pageInfo').text('第 ' + page + ' 页');
        });
    }

    function resetForm() { $('#eId,#eUsername,#ePassword,#eRealName,#ePhone,#eRemark').val(''); $('#eRole').val('STAFF'); $('#eStatus').val(1); }

    function edit(id) {
        api.get('/api/user/page', {page: 1, size: 100}).then(function (d) {
            var r = d.records.find(function (x) { return x.id === id; });
            if (!r) return;
            $('#eId').val(r.id); $('#eUsername').val(r.username).prop('disabled', true);
            $('#eRealName').val(r.realName); $('#ePhone').val(r.phone);
            $('#eRole').val(r.roleCode); $('#eStatus').val(r.status); $('#eRemark').val(r.remark);
            $('#pwdWrap').hide();
            $('#modalTitle').text('编辑用户');
            $('#editModal').modal('show');
        });
    }

    function save() {
        var data = {
            username: $('#eUsername').val().trim(),
            realName: $('#eRealName').val().trim(),
            phone: $('#ePhone').val().trim(),
            roleCode: $('#eRole').val(),
            status: parseInt($('#eStatus').val()),
            remark: $('#eRemark').val().trim()
        };
        var id = $('#eId').val();
        if (!id) data.password = $('#ePassword').val().trim();
        var p = id ? api.put('/api/user', $.extend({id: parseInt(id)}, data)) : api.post('/api/user', data);
        p.then(function () { toast('保存成功'); $('#editModal').modal('hide'); $('#eUsername').prop('disabled', false); load(page); });
    }

    function resetPwd(id) {
        if (!confirm('确认将该用户密码重置为 123456？')) return;
        api.post('/api/user/reset/' + id).then(function () { toast('密码已重置为 123456'); });
    }

    function del(id) {
        if (!confirm('确认删除该用户？')) return;
        api.del('/api/user/' + id).then(function () { toast('删除成功'); load(page); });
    }

    $(function () {
        $('#btnAdd').on('click', function () {
            resetForm();
            $('#eUsername').prop('disabled', false);
            $('#pwdWrap').show();
            $('#modalTitle').text('新增用户');
            $('#editModal').modal('show');
        });
        load(1);
    });
</script>
</body>
</html>
