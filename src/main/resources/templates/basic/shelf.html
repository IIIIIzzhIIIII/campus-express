<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('货架库位')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('shelf')}"></aside>
    <div class="main">
        <nav th:replace="~{fragments/layout :: topbar}"></nav>
        <main class="content">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">货架库位管理</h5>
                <button class="btn btn-primary" id="btnAdd"><i class="bi bi-plus-lg"></i> 新增货架</button>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4"><input class="form-control form-control-sm" id="qKeyword" placeholder="货架号/区域"></div>
                        <div class="col-md-2"><button class="btn btn-primary btn-sm w-100" onclick="load(1)">查询</button></div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead><tr><th>货架号</th><th>区域</th><th>状态</th><th>备注</th><th style="width:160px">操作</th></tr></thead>
                            <tbody id="tbody"></tbody>
                        </table>
                    </div>
                    <div class="pagination-wrap"><div class="text-muted small" id="pageInfo"></div><div id="pager"></div></div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增货架</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="eId">
            <div class="mb-3"><label class="form-label">货架号</label><input class="form-control" id="eNo" placeholder="如 A-01-01"></div>
            <div class="mb-3"><label class="form-label">区域</label><input class="form-control" id="eArea" placeholder="如 A区"></div>
            <div class="mb-3"><label class="form-label">备注</label><input class="form-control" id="eRemark"></div>
            <div class="mb-3"><label class="form-label">状态</label>
                <select class="form-select" id="eStatus"><option value="1">启用</option><option value="0">停用</option></select>
            </div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" onclick="save()">保存</button></div>
    </div></div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    var page = 1, size = 10;
    var isAdmin = /*[[${session.loginUser.roleCode == 'SUPER_ADMIN'}]]*/ false;

    function load(p) {
        page = p || 1;
        api.get('/api/shelf/page', {page: page, size: size, keyword: $('#qKeyword').val().trim()}).then(function (d) {
            var html = '';
            d.records.forEach(function (r) {
                var ops = '-';
                if (isAdmin) ops = '<button class="btn btn-sm btn-outline-primary me-1" onclick="edit(' + r.id + ')">编辑</button>'
                    + '<button class="btn btn-sm btn-outline-danger" onclick="del(' + r.id + ')">删除</button>';
                html += '<tr><td class="fw-bold">' + esc(r.shelfNo) + '</td><td>' + esc(r.area) + '</td>'
                    + '<td>' + (r.status === 1 ? '<span class="badge-soft text-bg-success">启用</span>' : '<span class="badge-soft text-bg-secondary">停用</span>') + '</td>'
                    + '<td>' + esc(r.remark) + '</td><td>' + ops + '</td></tr>';
            });
            $('#tbody').html(html || '<tr><td colspan="5" class="text-center text-muted py-4">暂无数据</td></tr>');
            renderPager($('#pager'), page, size, d.total, load);
            $('#pageInfo').text('第 ' + page + ' 页');
        });
    }

    function resetForm() { $('#eId,#eNo,#eArea,#eRemark').val(''); $('#eStatus').val(1); }

    function edit(id) {
        api.get('/api/shelf/page', {page: 1, size: 100}).then(function (d) {
            var r = d.records.find(function (x) { return x.id === id; });
            if (!r) return;
            $('#eId').val(r.id); $('#eNo').val(r.shelfNo); $('#eArea').val(r.area);
            $('#eRemark').val(r.remark); $('#eStatus').val(r.status);
            $('#modalTitle').text('编辑货架');
            $('#editModal').modal('show');
        });
    }

    function save() {
        var data = {shelfNo: $('#eNo').val().trim(), area: $('#eArea').val().trim(), remark: $('#eRemark').val().trim(), status: parseInt($('#eStatus').val())};
        var id = $('#eId').val();
        var p = id ? api.put('/api/shelf', $.extend({id: parseInt(id)}, data)) : api.post('/api/shelf', data);
        p.then(function () { toast('保存成功'); $('#editModal').modal('hide'); load(page); });
    }

    function del(id) {
        if (!confirm('确认删除？')) return;
        api.del('/api/shelf/' + id).then(function () { toast('删除成功'); load(page); });
    }

    $(function () {
        if (!isAdmin) $('#btnAdd').hide();
        $('#btnAdd').on('click', function () { resetForm(); $('#modalTitle').text('新增货架'); $('#editModal').modal('show'); });
        load(1);
    });
</script>
</body>
</html>
