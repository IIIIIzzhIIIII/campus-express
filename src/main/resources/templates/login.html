<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录')}"></head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-boxes" style="font-size:42px;color:#0d6efd"></i>
            <h4 class="mt-2 mb-0">校园快递驿站管理系统</h4>
            <p class="text-muted small mb-0">Campus Express Station Management</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">账号</label>
                <input class="form-control" name="username" placeholder="请输入账号" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
        <p class="text-muted small text-center mt-3 mb-0">默认账号：admin / 123456（超级管理员）</p>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    $('#loginForm').on('submit', function (e) {
        e.preventDefault();
        $.ajax({
            url: '/api/login',
            method: 'POST',
            data: JSON.stringify({username: $('[name=username]').val(), password: $('[name=password]').val()}),
            contentType: 'application/json;charset=UTF-8',
            dataType: 'json'
        }).then(function (res) {
            if (res.code === 200) {
                location.href = '/index';
            } else {
                toast(res.msg, 'danger');
            }
        }).fail(function () {
            toast('登录失败', 'danger');
        });
    });
</script>
</body>
</html>
